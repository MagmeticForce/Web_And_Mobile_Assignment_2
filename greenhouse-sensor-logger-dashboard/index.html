<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenhouse Logger</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="portal-header">
      <div class="header-content">
        <div class="brand">
          <span class="brand-icon">🌱</span>
          <h1>Greenhouse Sensor <span class="brand-subtitle">Logger Dashboard</span></h1>
        </div>
        <div class="header-status">
          Active Logs: <span id="logs-count" class="badge-count">0</span>
        </div>
      </div>
    </header>
    <main class="portal-container">
      <aside class="panel form-panel">
        <h2 class="panel-title">Record Data</h2>
        <div
          id="form-error-banner"
          class="alert alert-danger hidden"
          rule="alert"
        ></div>

        <!-- Form input -->
        <form id="data-form" action="#" novalidate>
          <div class="form-group">
            <label for="ph" class="form-label">
              pH
              <span class="required">*</span>
            </label>
            <input
              type="number"
              name="ph"
              id="ph"
              class="form-control"
              min="0"
              max="14"
              placeholder="6"
              required
            />
          </div>
          <div class="form-group">
            <label for="ec" class="form-label">
              EC
              <span class="required">*</span>
            </label>
            <input
              type="number"
              name="ec"
              id="ec"
              class="form-control"
              min="0"
              max="10"
              placeholder="1.8"
              required
            />
          <div class="form-group">
            <label for="air-temperature" class="form-label">
              Air Temperature (°F) <span class="required">*</span>
            </label>
            <input
              type="number"
              name="air-temperature"
              id="air-temperature"
              class="form-control"
              min="-4"
              max="140"
              placeholder="75"
              required
            />
          </div>
          <div class="form-group">
            <label for="relative-humidity" class="form-label">
              Relative Humidity <span class="required">*</span>
            </label>
            <input
              type="number"
              name="relative-humidity"
              id="relative-humidity"
              class="form-control"
              min="0"
              max="100"
              placeholder="65"
              required
            />
          </div>
          <button type="submit" id="button-submit" class="button button-primary button-block">
            Log Data
          </button>
        </form>
      </aside>

      <!-- Right container for output: DYNAMIC CONTENT injection -->
      <section class="panel records-panel">
        <header class="records-header">
            <h2 class="panel-title">Data Records</h2>
            <button id="button-clear-all" class="button button-outline-danger button-small">Clear All</button>
        </header>

        <!-- Create two states: (1) intial state; (2) state after user interacts with UI -->
         <div id="empty-state" class="empty-state">
            <span class="empty-icon">📋</span>
            <p>No active records logged.</p>
         </div>

         <!-- Create an empty element whose children will be dynamically created by JS: -->
         <ul id="records-list" class="records-grid" aria-live="polite"></ul>
      </section>
    </main>
    <footer class="portal-footer">
        <p>&copy; 2026 Greenhouse Sensor (CSI-3150 Web and Mobile Fall 2026 Assignment 2B)</p>
    </footer>
  </body>
</html>
